# 0 is too far from ` ;)
set -g base-index 1

unbind C-b

set -g prefix M-w 
bind M-w send-prefix

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g mouse on

set -g default-terminal "tmux-256color"
set -g status-keys vi
set -g history-limit 10000

set -g mode-keys vi
set -g monitor-activity on

# Sane scrolling
set -ag terminal-overrides ",xterm-256color:Tc"

bind-key n send-keys "/usr/local/bin/nvim" Enter

bind-key v split-window -h
bind-key s split-window -v -p 20 -c "#{pane_current_path}"
bind-key e split-window -bf

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Crtl arrow to switch windows
bind -n C-Left  previous-window
bind -n C-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r run-shell 'tmux source-file "$CUSTOM_CONFIGS_HOME/.tmux.conf"'
set -g default-command /bin/zsh

# THEME
##### GENERAL OPTIONS #####
# Status bar at the top with transparent background
set -g status-position top
set -g status-style bg="#3B4261",fg=white

# Update interval (in seconds)
set -g status-interval 1

##### WINDOW STYLE #####
# Inactive windows
setw -g window-status-style bg=default,fg=white
setw -g window-status-format "#[fg=cyan] 󰓩 #[fg=blue]#W#{?window_zoomed_flag, 🔍,}#[default]"

# Active window (highlighted)
setw -g window-status-current-style fg=black
setw -g window-status-current-format "#[fg=red,bold]  #W#{?window_zoomed_flag, 🔍,}#[default]"

# Window with activity
setw -g window-status-activity-style fg=yellow,bold

# Window with bell
setw -g window-status-bell-style fg=red,bold

##### LEFT SIDE: SESSION NAME #####
set -g status-left "#[fg=green] #[fg=white]#S #[default]"
set -g status-left-length 100

##### RIGHT SIDE: SYSTEM INFO #####
# Show time, date, battery, hostname
set -g status-right-length 150
set -g status-right "#(whoami) #[fg=magenta] %Y-%m-%d #[fg=yellow]󰥔 %H:%M #[fg=cyan]🔋#(battery_level.sh)"

##### OPTIONAL GIT BRANCH PER WINDOW (EXPERIMENTAL) #####

# You can optionally include this in the window name if you have a helper script
#setw -g automatic-rename on
set -g status-format[1] "#{?window_active,#[fg=green],}#I:#W #(tmux_git_branch.sh)"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
 
set -g @plugin 'tmux-plugins/tmux-resurrect'

bind g run-shell -b '"$CUSTOM_CONFIGS_HOME/automation/gcloud-auth/init-auth.sh" | tmux load-buffer - && tmux paste-buffer'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'
 
